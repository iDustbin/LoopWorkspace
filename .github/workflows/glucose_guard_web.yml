name: Glucose Guard Web
on:
  push:
    paths:
      - "glucose-guard-design/web/**"
      - ".github/workflows/glucose_guard_web.yml"
  pull_request:
    paths:
      - "glucose-guard-design/web/**"
      - ".github/workflows/glucose_guard_web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: glucose-guard-design/web/package-lock.json

      - name: Install and build
        working-directory: glucose-guard-design/web
        run: |
          npm ci
          npm run build
