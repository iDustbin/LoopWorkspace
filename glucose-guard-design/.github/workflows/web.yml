name: Web
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build container
        run: docker build -t "ghcr.io/idustbin/glucose-guard-web:${GITHUB_SHA}" web

      - name: Push container
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "ghcr.io/idustbin/glucose-guard-web:${GITHUB_SHA}" ghcr.io/idustbin/glucose-guard-web:latest
          docker push "ghcr.io/idustbin/glucose-guard-web:${GITHUB_SHA}"
          docker push ghcr.io/idustbin/glucose-guard-web:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
