apiVersion: apps/v1
kind: Deployment
metadata:
  name: glucose-guard-web
  namespace: glucose-guard
  labels:
    app.kubernetes.io/name: glucose-guard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: glucose-guard-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glucose-guard-web
    spec:
      containers:
        - name: web
          image: ghcr.io/idustbin/glucose-guard-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: glucose-guard-web
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
