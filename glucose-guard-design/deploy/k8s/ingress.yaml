apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glucose-guard-web
  namespace: glucose-guard
  labels:
    app.kubernetes.io/name: glucose-guard-web
spec:
  ingressClassName: nginx
  rules:
    - host: glucose-guard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glucose-guard-web
                port:
                  name: http
